name: Build, Push & Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.vars.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Definir tag da imagem
        id: vars
        run: echo "image_tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/oneshift-organization/ost-backend.python/ost-api:${{ steps.vars.outputs.image_tag }}

  bump-gitops:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ost-infra
        uses: actions/checkout@v4
        with:
          repository: Oneshift-Organization/ost-infra
          token: ${{ secrets.GITOPS_INFRA_TOKEN }}
          path: ost-infra

      - name: Atualizar tag da imagem
        run: |
          cd ost-infra
          sed -i \
            "s#image: ghcr.io/oneshift-organization/ost-backend.python/ost-api:.*#image: ghcr.io/oneshift-organization/ost-backend.python/ost-api:${{ needs.build-and-push.outputs.image_tag }}#" \
            fluxcd/apps/api-deployment.yaml
          grep "image:" fluxcd/apps/api-deployment.yaml

      - name: Commit e push
        run: |
          cd ost-infra
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add fluxcd/apps/api-deployment.yaml
          git commit -m "chore(gitops): bump api para ${{ needs.build-and-push.outputs.image_tag }}"
          git push origin main
