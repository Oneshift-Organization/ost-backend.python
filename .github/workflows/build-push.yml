name: Build, Push & Deploy

on:
  push:
    branches: [main, develop]

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Definir tag da imagem
        id: vars
        run: echo "image_tag=${GITHUB_REF_NAME}-$(date -u +%s)-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/oneshift-organization/ost-backend.python/ost-api:${{ steps.vars.outputs.image_tag }}
