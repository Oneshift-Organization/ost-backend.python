name: Build, Push & Deploy

on:
  push:
    # main publica só pela esteira DevSecOps (devsecops.yml), após aprovação.
    branches: [develop]

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Definir tag da imagem
        id: vars
        run: echo "image_tag=${GITHUB_REF_NAME}-$(date -u +%s)-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Login no GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: true
          tags: ghcr.io/oneshift-organization/ost-backend.python/ost-api:${{ steps.vars.outputs.image_tag }}
