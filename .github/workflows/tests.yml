name: Tests

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  quality:
    name: Lint + testes unitários
    runs-on: ubuntu-latest
    env:
      TF_PLUGIN_CACHE_DIR: /home/runner/.terraform.d/plugin-cache
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff (bloqueante — áreas já limpas)
        # Gatear o repo inteiro deixaria o CI vermelho desde o dia 1: há ~250
        # lints pré-existentes em infrastructure/api/scripts. Bloqueamos onde
        # já está limpo (o núcleo puro e os testes), impedindo dívida NOVA ali.
        run: ruff check app/domain app/services app/schemas app/tests

      - name: Ruff (informativo — dívida a queimar)
        continue-on-error: true
        run: ruff check app/infrastructure app/api app/use_cases scripts

      - name: Terraform (validate e fmt dos pacotes gerados)
        # Os testes de `validate`/`fmt` pulam sem o binário (T0 do
        # PLANO_ESTRATEGIA_SPRINT_TERRAFORM). Sem o wrapper da action: os testes leem
        # o stdout do `validate -json`.
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - name: Cache dos providers do Terraform
        # Google, AWS, Azure e OCI somam perto de 1 GB por execução sem cache. As
        # versões vêm dos renderers (`~> 5.0` etc.), daí a chave.
        uses: actions/cache@v4
        with:
          path: /home/runner/.terraform.d/plugin-cache
          key: tf-plugins-${{ runner.os }}-${{ hashFiles('app/infrastructure/terraform/renderers/*.py') }}
          restore-keys: tf-plugins-${{ runner.os }}-

      - name: Diretório do cache de providers
        run: mkdir -p "$TF_PLUGIN_CACHE_DIR"

      - name: Testes unitários
        # Integração é exercida no job abaixo (precisa de Postgres).
        run: pytest -m "not integration" --no-cov -q

  gates:
    name: Gates do request (integração)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ost
          POSTGRES_PASSWORD: ost
          POSTGRES_DB: ost_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ost -d ost_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://ost:ost@localhost:5432/ost_test
      APP_ENV: development
      AUTH_ENABLED: "false"
      # `scripts/` importa `app.*`; sem isto o seed falha com ModuleNotFoundError.
      PYTHONPATH: .
      TF_PLUGIN_CACHE_DIR: /home/runner/.terraform.d/plugin-cache

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Migrations
        run: alembic upgrade head

      - name: Seeds de referência
        # Os gates exigem DE-PARA curado, metadata, catálogo e regras — sem eles
        # os testes mediriam o vazio e passariam por acidente (o conftest pula
        # declarando qual seed faltou, então a ausência apareceria como skip).
        #
        # ORDEM IMPORTA: `seed_service_metadata` também grava em
        # `cloud_services_comparation`, mas a partir de uma lista inline de 120
        # tuplas com tipos GROSSEIROS (`relational`). A fonte autoritativa é
        # `cloud_services_mapping.csv` (822 linhas, tipos finos como
        # `managed_relational_database`), carregada por `seed_from_csv`, que
        # limpa e recarrega a tabela. Por isso ele vem POR ÚLTIMO — com a ordem
        # invertida, um ambiente novo (inclusive produção) fica com o tipo
        # grosseiro e o DE-PARA por serviço perde precisão.
        run: |
          python -m app.infrastructure.database.seed_refactor
          python -m app.infrastructure.database.seed_service_metadata
          python -m app.infrastructure.database.seed_catalog_pareto
          python -m app.infrastructure.database.seed_classification_rules
          python -m app.infrastructure.database.seed_from_csv

      - name: Taxas de categoria (referência, sem rede)
        run: python scripts/sync_prices.py --providers categories

      - name: Terraform (validate e fmt dos pacotes gerados)
        # Os testes de `validate`/`fmt` pulam sem o binário (T0 do
        # PLANO_ESTRATEGIA_SPRINT_TERRAFORM). Sem o wrapper da action: os testes leem
        # o stdout do `validate -json`.
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - name: Cache dos providers do Terraform
        # Google, AWS, Azure e OCI somam perto de 1 GB por execução sem cache. As
        # versões vêm dos renderers (`~> 5.0` etc.), daí a chave.
        uses: actions/cache@v4
        with:
          path: /home/runner/.terraform.d/plugin-cache
          key: tf-plugins-${{ runner.os }}-${{ hashFiles('app/infrastructure/terraform/renderers/*.py') }}
          restore-keys: tf-plugins-${{ runner.os }}-

      - name: Diretório do cache de providers
        run: mkdir -p "$TF_PLUGIN_CACHE_DIR"

      - name: Gates
        # Um skip silencioso esconderia a rede de segurança caída: o conftest
        # pula quando falta banco ou seed, então aqui um skip é FALHA de
        # ambiente, não teste ignorável. (O gate de preço oficial é o único que
        # pode pular legitimamente — ele depende de fetch de rede.)
        run: |
          set -o pipefail
          pytest -m integration --no-cov -q -rs --strict-markers | tee /tmp/gates.txt
          if grep -qE "integração pulada" /tmp/gates.txt; then
            echo "::error::Gates pulados — Postgres ou seeds ausentes no CI."
            exit 1
          fi
