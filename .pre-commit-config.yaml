# Para ativar: pip install pre-commit && pre-commit install
# Docs: https://pre-commit.com

repos:
  # ── Utilitários gerais ─────────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: mixed-line-ending
        args: ["--fix=lf"]

  # ── Gitflow: bloqueia commits diretos em main e develop ──────────────────
  - repo: local
    hooks:
      - id: no-commit-to-protected-branches
        name: Bloquear commit direto em main/develop
        language: script
        entry: .github/hooks/no-commit-to-protected-branches.sh
        always_run: true
        pass_filenames: false

  # ── Segurança: variáveis de ambiente hardcoded ────────────────────────────
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks

